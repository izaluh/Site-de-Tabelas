<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Tabelas</title>
</head>
<style>

    body{
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f0f0f0;
    }
    .principal{width: 800px;
    border: 1px solid #ccc;
    background-color: #fff;
    margin: 0 auto;
    border-collapse: collapse;
    }
     .topo{
        background-color: rgb(139, 0, 0);
        color: white;
        text-align: center;
        padding: 20px;
    }
    .subtopo{
        background-color: rgb(204, 28, 28);
        color: white;
        text-align: center;
        padding: 5px;
        font-size: 0.9em;
    }

</style>
<body>
    <table class="principal">

        <tr>
            <td colspan="2" class="topo">
                <h1 style="margin: 0;">Meu site</h1>
            </td>
        </tr>
         <tr>
            <td colspan="2" class="subtopo">
                Usando tabelas em HTML
            </td>
        </tr>

    </table>
</body>
</html>
